<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Streaming AI Chat</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at top, rgb(59 130 246 / 14%), transparent 45%),
          #0b1020;
      }

      .chat {
        width: min(100%, 800px);
        height: min(820px, calc(100vh - 48px));
        min-height: 420px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #273248;
        border-radius: 20px;
        background: rgb(17 24 39 / 94%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }

      header {
        padding: 22px 24px;
        border-bottom: 1px solid #273248;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.01em;
      }

      header p {
        margin: 6px 0 0;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        scroll-behavior: smooth;
      }

      .message {
        width: fit-content;
        max-width: min(85%, 620px);
        margin: 0 0 16px;
        padding: 12px 15px;
        border-radius: 16px;
        line-height: 1.6;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .message.user {
        margin-left: auto;
        border-bottom-right-radius: 5px;
        background: #2563eb;
        color: white;
      }

      .message.assistant {
        margin-right: auto;
        border: 1px solid #29364d;
        border-bottom-left-radius: 5px;
        background: #182235;
      }

      .message.error {
        border-color: #7f1d1d;
        background: #351b25;
        color: #fecaca;
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 18px;
        border-top: 1px solid #273248;
        background: #111827;
      }

      textarea {
        flex: 1;
        min-height: 48px;
        max-height: 160px;
        resize: vertical;
        padding: 13px 15px;
        border: 1px solid #344158;
        border-radius: 12px;
        outline: none;
        background: #0b1020;
        color: #f8fafc;
        font: inherit;
      }

      textarea:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgb(96 165 250 / 15%);
      }

      button {
        min-width: 82px;
        height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 12px;
        background: #3b82f6;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #2563eb;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .hint {
        margin: 0;
        padding: 0 20px 14px;
        color: #718096;
        background: #111827;
        font-size: 0.78rem;
        text-align: center;
      }

      @media (max-width: 520px) {
        body {
          padding: 0;
        }

        .chat {
          width: 100%;
          height: 100vh;
          min-height: 100vh;
          border: 0;
          border-radius: 0;
        }

        header {
          padding: 18px;
        }

        #messages {
          padding: 18px;
        }

        .composer {
          gap: 8px;
          padding: 12px;
        }

        button {
          min-width: 72px;
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="chat">
      <header>
        <h1>Streaming AI Chat</h1>
        <p>Responses appear as the model generates them.</p>
      </header>

      <section id="messages" aria-live="polite" aria-label="Chat messages">
        <div class="message assistant">Hi! What would you like to ask?</div>
      </section>

      <form id="chat-form" class="composer">
        <textarea
          id="prompt"
          name="message"
          placeholder="Write a message..."
          aria-label="Your message"
          required
        ></textarea>
        <button id="send-button" type="submit">Send</button>
      </form>
      <p class="hint">Press Enter to send · Shift + Enter for a new line</p>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const promptInput = document.querySelector("#prompt");
      const sendButton = document.querySelector("#send-button");
      const messages = document.querySelector("#messages");

      function addMessage(content, className) {
        const element = document.createElement("div");
        element.className = `message ${className}`;
        element.textContent = content;
        messages.append(element);
        messages.scrollTop = messages.scrollHeight;
        return element;
      }

      function handleEventBlock(block, assistantMessage) {
        const dataLine = block.split("\n").find((line) => line.startsWith("data:"));
        if (!dataLine) return;

        const data = dataLine.slice(5).trim();
        if (!data) return;

        let payload;
        try {
          payload = JSON.parse(data);
        } catch {
          throw new Error("The server sent an invalid streaming response.");
        }

        if (typeof payload.token === "string") {
          assistantMessage.textContent += payload.token;
          messages.scrollTop = messages.scrollHeight;
        } else if (typeof payload.message === "string" || typeof payload.error === "string") {
          throw new Error(payload.message || payload.error);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = promptInput.value.trim();
        if (!message || sendButton.disabled) return;

        addMessage(message, "user");
        promptInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "Sending";
        const assistantMessage = addMessage("", "assistant");

        try {
          const response = await fetch("/chat-with-stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userInput: message }),
          });

          if (!response.ok) {
            throw new Error(`Request failed with HTTP ${response.status}.`);
          }
          if (!response.body) {
            throw new Error("This browser does not support response streaming.");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value, { stream: !done });

            const blocks = buffer.split(/\r?\n\r?\n/);
            buffer = blocks.pop() || "";
            for (const block of blocks) {
              handleEventBlock(block, assistantMessage);
            }

            if (done) break;
          }

          if (buffer.trim()) handleEventBlock(buffer, assistantMessage);
          if (!assistantMessage.textContent) assistantMessage.remove();
        } catch (error) {
          const messageText = error instanceof Error ? error.message : "Unknown error.";
          if (assistantMessage.textContent) {
            assistantMessage.classList.add("error");
            assistantMessage.textContent += `\n\nError: ${messageText}`;
          } else {
            assistantMessage.remove();
            addMessage(`Sorry, the request failed: ${messageText}`, "assistant error");
          }
        } finally {
          sendButton.disabled = false;
          sendButton.textContent = "Send";
          promptInput.focus();
        }
      });

      promptInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
